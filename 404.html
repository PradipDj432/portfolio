<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Pradip Jaliya</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <!-- GitHub Pages shows this page for any wrong address, at any depth (for example /portfolio/a/b/c).
       This script sets the site's base folder first, then loads the site's own files from there,
       so the styles and links still work. It also applies the saved light/dark choice. -->
  <script>
    (function () {
      var root = "/";
      if (location.hostname.endsWith(".github.io")) {
        var repo = location.pathname.split("/")[1];
        if (repo) root = "/" + repo + "/";
      }
      document.write(
        '<base href="' + root + '">' +
        '<link rel="icon" href="images/favicon.svg" type="image/svg+xml">' +
        '<link rel="stylesheet" href="css/style.css">'
      );
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="not-found">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow"><span>404</span>Page not found</p>
      <h1>This page <em>doesn't exist.</em></h1>
      <p class="section-lede">It may have moved, or the link may be wrong.</p>
      <div class="button-row">
        <a class="button" href="./">Go to the home page</a>
        <a class="button button-ghost" href="./#projects">See my projects</a>
      </div>
    </div>
  </main>
</body>
</html>
